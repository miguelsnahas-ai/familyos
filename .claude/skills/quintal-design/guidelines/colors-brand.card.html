<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--pessego);font-family:var(--font-text);color:var(--text-primary);}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.sw{display:flex;flex-direction:column;gap:6px;width:118px;}
.chip{height:72px;border-radius:var(--radius-card);}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);}
.nm{font-family:var(--font-display);font-weight:700;font-size:14px;}</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#3A2C43;border:1px solid var(--border)"></div><div class="nm">Ameixa</div><div class="mono">#3A2C43 · --ameixa</div></div>
  <div class="sw"><div class="chip" style="background:#FDF2EC;border:1px solid var(--border)"></div><div class="nm">Pêssego</div><div class="mono">#FDF2EC · --pessego</div></div>
  <div class="sw"><div class="chip" style="background:#C9B6E4;border:1px solid var(--border)"></div><div class="nm">Lilás</div><div class="mono">#C9B6E4 · --lilas</div></div>
  <div class="sw"><div class="chip" style="background:#E0836C;border:1px solid var(--border)"></div><div class="nm">Barro</div><div class="mono">#E0836C · --barro</div></div>
  <div class="sw"><div class="chip" style="background:#FBD87F;border:1px solid var(--border)"></div><div class="nm">Manteiga</div><div class="mono">#FBD87F · --manteiga</div></div>
</div>
