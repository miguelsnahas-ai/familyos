<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--pessego);font-family:var(--font-text);color:var(--text-primary);}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;}
.sw{display:flex;flex-direction:column;gap:6px;width:118px;}
.chip{height:0px;border-radius:var(--radius-card);}
.mono{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);}
.nm{font-family:var(--font-display);font-weight:700;font-size:14px;}</style>
<div class="row" style="gap:16px;align-items:center">
  <div style="flex:0 0 auto;width:110px;height:64px;background:var(--surface);border:1px solid var(--border);border-radius:14px"></div>
  <div style="flex:0 0 auto;width:110px;height:64px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-sm)"></div>
  <div style="flex:0 0 auto;width:110px;height:64px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-md)"></div>
  <span class="mono">flat · sm · md (hover)</span>
</div>
