<!-- @dsCard group="Components" viewport="700x400" name="Content" subtitle="Pillar card, chat thread, child profile, step, stat" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--pessego);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} .grid{display:grid;gap:12px;}</style>
<div id="root"></div>
<script type="text/babel">
  const NS = window[Object.keys(window).find(k => /^DesignSystem_/.test(k))] || {};
  const { PillarCard, ChatThread, ChatBubble, ChildProfileCard, StepItem, HighlightStat, Icon } = NS;
  function Demo(){ return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,alignItems:'start'}}>
      <PillarCard index="01" title="Sono" icon={<Icon name="moon" />}
        description="Ajuda a entender e organizar padrões, sem virar polícia do sono."
        example="A Laura dormiu 40 minutos a menos. Vamos adaptar o restante do dia." />
      <ChatThread>
        <ChatBubble>A Laura acabou de acordar. Dormiu 40 minutos a menos hoje — vamos deixar a tarde mais leve.</ChatBubble>
        <ChatBubble from="family">Perfeito, obrigada</ChatBubble>
      </ChatThread>
      <ChildProfileCard name="Laura" age="2 anos e 3 meses" rows={[
        {label:'Rotina', value:'Acorda 7h · soneca 13h–14h30 · dorme 20h'},
        {label:'Interesses', value:'Caixas, água, empilhar objetos, música'},
        {label:'Observação dos pais', value:'Ela anda muito seletiva com comida essa semana.'}]} />
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        <StepItem number="01" title="Você conta." description="O sistema entende o momento." />
        <StepItem number="02" title="O sistema aprende." description="Registra padrões de sono, brincadeiras recentes, interesses." />
        <HighlightStat value="100 famílias" label="Preço especial de fundador para quem entrar agora." />
      </div>
    </div>
  ); }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
