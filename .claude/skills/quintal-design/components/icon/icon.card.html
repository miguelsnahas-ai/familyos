<!-- @dsCard group="Components" viewport="700x140" name="Icons" subtitle="Lucide line glyphs, 1.8px stroke" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--pessego);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} .grid{display:grid;gap:12px;}</style>
<div id="root"></div>
<script type="text/babel">
  const NS = window[Object.keys(window).find(k => /^DesignSystem_/.test(k))] || {};
  const { Icon } = NS;
  function Demo(){ return (
    <div className="row" style={{gap:22}}>
      {(Icon.names||[]).map(n => (
        <span key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,width:64}}>
          <Icon name={n} size={22} />
          <span style={{fontFamily:'var(--font-mono)',fontSize:10,color:'var(--text-tertiary)'}}>{n}</span>
        </span>))}
    </div>
  ); }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
