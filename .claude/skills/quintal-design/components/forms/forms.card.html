<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--pessego);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} .grid{display:grid;gap:12px;}</style>
<div id="root"></div>
<script type="text/babel">
  const NS = window[Object.keys(window).find(k => /^DesignSystem_/.test(k))] || {};
  const { Input, Switch, Chip } = NS;
  function Demo(){
    const [on,setOn] = React.useState(true);
    const [sel,setSel] = React.useState('Sono');
    return (
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
        <Input label="Seu WhatsApp" placeholder="(11) 99999-9999" hint="Só usamos para avisar da abertura." />
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="row">
            {['Sono','Rotina','Livre brincar','Desenvolvimento'].map(t =>
              <Chip key={t} selected={sel===t} onClick={()=>setSel(t)}>{t}</Chip>)}
          </div>
          <Switch checked={on} onChange={setOn} label="Receber sugestões pela manhã" />
          <Switch checked={false} onChange={()=>{}} label="Resumo semanal por e-mail" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
