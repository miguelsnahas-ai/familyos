<!-- @dsCard group="Components" viewport="700x210" name="Buttons" subtitle="Primary, secondary, ghost — light and on plum" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--pessego);} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;} .grid{display:grid;gap:12px;}</style>
<div id="root"></div>
<script type="text/babel">
  const NS = window[Object.keys(window).find(k => /^DesignSystem_/.test(k))] || {};
  const { Button, IconButton, Icon } = NS;
  function Demo(){ return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="row">
        <Button>Entrar na lista</Button>
        <Button variant="secondary">Como funciona</Button>
        <Button variant="ghost">Saber mais →</Button>
        <Button size="sm">Quero o setup</Button>
        <Button disabled>Indisponível</Button>
        <IconButton label="Menu"><Icon name="menu" /></IconButton>
      </div>
      <div className="row" style={{background:'var(--surface-dark)',padding:16,borderRadius:'var(--radius-card)'}}>
        <Button>Entrar na lista</Button>
        <Button variant="secondary" onDark>Como funciona</Button>
        <Button variant="ghost" onDark>Saber mais →</Button>
        <IconButton label="Fechar" onDark><Icon name="x" /></IconButton>
      </div>
    </div>
  ); }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
